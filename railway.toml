[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "cd saas/backend",
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
# Run SQL migrations before workers start so deploy fails fast if a migration errors.
# Single worker: avoids parallel migration races if start is ever scaled up.
cmd = "cd saas/backend && python -m scripts.run_migrations && gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
