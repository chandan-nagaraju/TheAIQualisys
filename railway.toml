[build]
builder = "NIXPACKS"

[phases.setup]
nixPkgs = ["python311"]

[phases.install]
cmds = [
  "cd saas/backend",
  "python -m pip install --upgrade pip",
  "pip install -r requirements.txt"
]

[start]
cmd = "cd saas/backend && gunicorn app.main:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
