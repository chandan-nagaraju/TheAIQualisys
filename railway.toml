# API service: in Railway → Settings → set "Root Directory" to `saas/backend`.
#
# Leave "Custom Start Command" EMPTY (Dashboard + no deploy.startCommand here). Overrides use exec form and
# break `$PORT`. The container runs `saas/backend/run_gunicorn.py`, which reads PORT from the environment.
[build]
builder = "DOCKERFILE"
dockerfilePath = "saas/backend/Dockerfile"
