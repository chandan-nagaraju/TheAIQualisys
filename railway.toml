# API service: in Railway → Settings → set "Root Directory" to `saas/backend`.
# (Docker build context is that folder, so the Dockerfile uses COPY requirements.txt / COPY . .)
[build]
builder = "DOCKERFILE"
dockerfilePath = "saas/backend/Dockerfile"

[deploy]
# Single worker: one in-process subscription reminder scheduler; multiple workers would duplicate emails.
startCommand = "gunicorn app.main:app -w 1 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
