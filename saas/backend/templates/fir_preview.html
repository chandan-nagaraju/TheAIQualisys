<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Final Inspection Report Preview</title>
  <style>
  @page { size: A4 landscape; margin: 10mm; }
  body { font-family: Calibri, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
  body.generating-pdf { min-width: 297mm; width: 297mm; margin: 0 auto; background: #fff; }

  #reportRoot { width: 100%; max-width: 297mm; margin: 0 auto; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
  body.generating-pdf #reportRoot { width: 297mm !important; min-width: 297mm; max-width: 297mm; margin: 0 auto; }

  .report-container {
    position: relative;
    background: #fafaf7;
    border: 1px solid #222;
    width: 100%;
    max-width: 297mm;
    margin: 10px auto;
    padding: 6px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    box-sizing: border-box;
    page-break-after: auto;
    overflow: hidden;
    transform: rotate(-0.06deg);
    filter: grayscale(100%) contrast(1.06);
  }
  /* Subtle scan / photocopy texture */
  .report-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(0,0,0,0.04) 1px,
      rgba(0,0,0,0.04) 2px
    );
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  body.generating-pdf .report-container { overflow: visible; border: 1px solid #000; box-shadow: none; max-width: 270mm; transform: none; }

  .header-table, .data-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 11px;
    border: 1px solid #333;
  }
  .data-table { table-layout: fixed; border-spacing: 0; }
  .data-table thead { display: table-header-group; }
  .header-table td, .header-table th {
    border: 1px solid #333;
    padding: 4px;
    vertical-align: middle;
    text-align: center;
    box-sizing: border-box;
    word-wrap: break-word;
  }
  .data-table td, .data-table th {
    border: 1px solid #333;
    padding: 1px 2px;
    vertical-align: middle;
    text-align: center;
    box-sizing: border-box;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: normal;
    line-height: 1.25;
  }
  .data-table td input, .data-table th input,
  .data-table td textarea, .data-table th textarea {
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .header-table .logo-cell {
    text-align: center;
    vertical-align: middle;
  }
  .header-table .small-cell { text-align: left; }
  .header-table { table-layout: fixed; }

  .header-title { font-size: 20px; font-weight: bold; text-align: center; }
  .logo-cell {
    font-style: italic;
    font-weight: bold;
    font-size: 18px;
    text-align: center;
  }
  .small-cell { font-size: 12px; text-align: left; padding: 3px 6px; }
  .bold { font-weight: bold; }
  .section-title {
    background: linear-gradient(180deg, #ececec 0%, #d4d4d4 100%);
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 3px 5px;
    border: 1px solid #000;
    line-height: 1.3;
  }
  /* Table subheads — neutral B&W (no blue) */
  .fir-col-head, .fir-col-head-num {
    background: #dedede !important;
    color: #000 !important;
    font-weight: bold;
  }
  .fir-col-head-num.fir-measured-inactive,
  .data-table td.fir-measured-inactive {
    background: #f0f0f0 !important;
    color: #888 !important;
  }
  input.actual-value:disabled {
    color: #999 !important;
    background: transparent !important;
    cursor: not-allowed;
  }
  body.generating-pdf .section-title { page-break-after: avoid; border-width: 1px; }
  body.generating-pdf .data-table td, body.generating-pdf .data-table th { border: 1px solid #333; }
  body.generating-pdf .data-table tbody tr { page-break-inside: avoid; }
  body.generating-pdf .signatures-section td.status-btn,
  body.generating-pdf #status-accepted,
  body.generating-pdf #status-rejected { border: 1px solid #333 !important; }
  /* html2canvas ignores CSS filter — PDF capture still showed color logos; force B&W in PDF pass */
  body.generating-pdf #status-rejected.status-btn.highlight {
    background: #404040 !important;
    color: #fff !important;
    border: 1px solid #000 !important;
  }
  body.generating-pdf input:focus,
  body.generating-pdf textarea:focus {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
  }

  input[type="text"] {
    width: 100%;
    border: none;
    outline: none;
    text-align: center;
    background: none;
    line-height: 1.25;
    padding: 0 1px;
  }
  .data-table textarea,
  .data-table input.method-input,
  .data-table input.special-char-input {
    font-size: 15px;
    font-family: inherit;
  }
  input[type="text"]:focus {
    background: #e6f0ff;
    text-align: left;
    border: 1px solid #007bff;
  }
  .header-table td input, .header-table th input,
  .header-table td textarea, .header-table th textarea {
    min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
  }
  .data-table td input, .data-table th input,
  .data-table td textarea, .data-table th textarea {
    min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
  }
  .header-table textarea {
    resize: none; border: none; outline: none; font: inherit; font-size: 11px; text-align: center;
    background: none; overflow: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    line-height: 1.25; padding: 0 1px; min-height: 1.4em;
  }
  .data-table textarea {
    resize: none; border: none; outline: none; font: inherit; font-size: 12px; text-align: center;
    background: none; overflow: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    line-height: 1.25; padding: 0 1px; min-height: 1.4em;
  }
  .header-table textarea:focus, .data-table textarea:focus { background: #e6f0ff; border: 1px solid #007bff; }

  @font-face {
    font-family: 'Quali_1';
    src: {% if quali_font_data_uri %}url("{{ quali_font_data_uri }}") format('{{ quali_font_format }}'), {% endif %}local('Quali_1'){% if api_static_base %}, url("{{ api_static_base }}fonts/Quali_1.woff2") format('woff2'), url("{{ api_static_base }}fonts/Quali_1.woff") format('woff'), url("{{ api_static_base }}fonts/Quali_1.ttf") format('truetype'){% endif %};
    font-display: swap;
  }
  .quali-font,
  input.actual-value,
  input.remarks-value {
    font-family: 'Quali_1', sans-serif;
    line-height: 1.5;
  }
  .data-table input.actual-value,
  .data-table input.remarks-value {
    font-size: 25px;
    min-height: 0;
  }
  input.actual-value,
  input.remarks-value {
    min-height: 0;
  }

  button.upload-btn {
    background-color: #007bff; color: white; border: none;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button.upload-btn:hover { background-color: #0056b3; }
  .signature-cell { text-align: center; vertical-align: middle; padding: 10px; box-sizing: border-box; }
  .signature-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .signature-preview {
    height: 50px;
    width: auto;
    max-width: 80%;
    object-fit: contain;
    margin-top: 6px;
    border: none;
    /* Blend with report cell — avoid white box behind signatures. */
    background: transparent;
    /* Keep signature stroke dark/black while preserving transparency. */
    filter: grayscale(100%) contrast(1.9) brightness(0.78);
  }
  .fir-logo-img { filter: grayscale(100%) contrast(1.12) !important; }
  .download-btn {
    position: fixed; bottom: 20px; right: 20px;
    background-color: #28a745; color: white; border: none;
    padding: 12px 18px; border-radius: 6px;
    cursor: pointer; font-size: 15px; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;
  }
  .download-btn:hover { background-color: #1e7e34; }
  .autofill-btn {
    position: fixed; bottom: 20px; right: 180px;
    background-color: #17a2b8; color: white; border: none;
    padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 1000;
  }
  .autofill-btn:hover { background-color: #138496; }
  .status-btn { padding: 6px 12px; font-weight: bold; text-align: center; border: 1px solid #333; border-radius: 4px; }
  #status-accepted.status-btn { background: #e8e8e8; color: #333; }
  #status-accepted.status-btn.highlight { background: #e0e0e0; color: #333; border: 1px solid #333; }
  #status-rejected.status-btn { background: #e8e8e8; color: #333; }
  #status-rejected.status-btn.highlight { background: #dc3545; color: #fff; border: 1px solid #333; }
  .signatures-section td.status-btn { border: 1px solid #333; box-sizing: border-box; }

  /* Embedded in inspection results iframes: parent page drives autofill / ZIP */
  html.fir-embedded .download-btn,
  html.fir-embedded .autofill-btn { display: none !important; }

  @media print {
    body { background: none; }
    .download-btn, .autofill-btn { display: none; }
    .report-container { box-shadow: none; border: none; overflow: visible; transform: none; }
    .data-table thead { display: table-header-group; }
    .signatures-section { page-break-inside: avoid; }
    #reportRoot { width: 297mm; margin: 0 auto; }
    .report-container { max-width: 270mm; margin: 0 auto; }
  }
  </style>
</head>

<body>
  <button class="download-btn" id="downloadPDF">⬇ Download PDF</button>
  <button class="autofill-btn" id="autofillMeasuredBtn" type="button">Auto-fill measured values</button>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <div id="reportRoot"></div>

  <script>
  if (window.self !== window.top) {
    document.documentElement.classList.add('fir-embedded');
  }
  const globalSettings = {{ settings | tojson | safe }};
  const FIR_SPEC_DATA = {{ spec_data | tojson | safe }} || [];
  const FIR_CCP_DATA = {{ ccp_data | tojson | safe }} || [];
  const FIR_MATERIAL_DATA = {{ material_data | tojson | safe }} || [];
  const FIR_COATING_DATA = {{ coating_data | tojson | safe }} || [];

  const urlParams = new URLSearchParams(window.location.search);
  var FIR_BATCH_PDF_FAST = urlParams.get("batchPdf") === "1";
  /** Normal: ~100–200 KB PDFs. batchPdf=1: faster multi-report ZIP (inspection page embeds only). */
  var FIR_PDF_JPEG_QUALITY = FIR_BATCH_PDF_FAST ? 0.62 : 0.72;
  var FIR_PDF_CANVAS_SCALE = FIR_BATCH_PDF_FAST ? 0.84 : 1.12;
  var FIR_PDF_IMG_JPEG = FIR_BATCH_PDF_FAST ? 0.60 : 0.72;
  /** Max longest edge when rasterizing images for PDF (batch mode shrinks work for html2canvas). */
  var FIR_PDF_IMG_MAX_EDGE = FIR_BATCH_PDF_FAST ? 960 : 100000;

  const partName = urlParams.get('partName');
  const description = urlParams.get('description');
  const drawRev = urlParams.get('drawRev') || "";
  const vendorCode = urlParams.get('vendorCode') || "";
  const customer = urlParams.get('customer') || "";
  const reportNo = urlParams.get('reportNo') || "";
  const invoiceNo = urlParams.get('invoiceNo') || "";
  const reportDate = urlParams.get('reportDate') || "";
  const lotQty = urlParams.get('quantity') || "";
  const sampleSize = urlParams.get('sampleSize') || "";
  const noOfParamsParam = parseInt(urlParams.get('noOfParams'));
  const totalRows = FIR_SPEC_DATA.length > 0 ? FIR_SPEC_DATA.length : (noOfParamsParam || 18);

  /**
   * How many "Actual Measured Values" columns to use (1–5) for sections A, B, D.
   * Table always shows 5 columns; only the first N get data. Invalid/empty → 5 (legacy URLs).
   * Values above 5 are treated as 5 (sample size is never expected > 5 in production).
   */
  function firParseSampleSizeN(raw) {
    const s = (raw == null || raw === undefined) ? "" : String(raw).trim();
    if (!s) return 5;
    const n = parseInt(s, 10);
    if (isNaN(n)) return 5;
    if (n < 1) return 1;
    if (n > 5) return 5;
    return n;
  }

  function firGetMeasuredColumnCount() {
    const el = document.getElementById("firSampleSizeInput");
    return firParseSampleSizeN(el ? el.value : sampleSize);
  }

  function firApplyMeasuredColumnAvailability() {
    const n = firGetMeasuredColumnCount();
    ["dimension-table", "ccp-table", "coating-table"].forEach(function(tableId) {
      const table = document.getElementById(tableId);
      if (!table) return;
      const headNums = table.querySelectorAll("thead .fir-col-head-num");
      headNums.forEach(function(th, idx) {
        const col = idx + 1;
        th.classList.toggle("fir-measured-inactive", col > n);
      });
      table.querySelectorAll("tbody tr").forEach(function(tr) {
        const cells = tr.querySelectorAll(":scope > td");
        for (var ci = 5; ci <= 9; ci++) {
          const td = cells[ci];
          if (!td) continue;
          const col = ci - 4;
          const inactive = col > n;
          td.classList.toggle("fir-measured-inactive", inactive);
          const inp = td.querySelector("input.actual-value") || td.querySelector('input[type="text"]');
          if (inp) {
            if (inactive) {
              inp.value = "";
              inp.disabled = true;
            } else {
              inp.disabled = false;
            }
          }
        }
      });
    });
  }

  function esc(s) {
    if (s == null || s === undefined) return '';
    return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  if (!partName || !description) {
    document.body.innerHTML = `<h2 style='text-align:center;color:red;'>Missing part data. Please go back and fill the form.</h2>
    <div style='text-align:center;'><button onclick='history.back()'>Go Back</button></div>`;
  } else {
    let html = ``;
    let slno = 1;
    const root = document.getElementById('reportRoot');

    html += `<div class='report-container'>`;
    html += `
      <table class="header-table">
        <tr>
          <td rowspan="2" colspan="5" class="logo-cell" id="companyCode"></td>
          <td colspan="7" class="header-title">FINAL INSPECTION REPORT</td>
          <td colspan="4" class="small-cell" id="docInfo"></td>
        </tr><tr></tr>
        <tr><td class="bold" colspan="2">VENDOR CODE :</td><td colspan="3"><input type="text" value="${vendorCode}"></td>
        <td class="bold" colspan="2">CUSTOMER</td><td colspan="4"><input type="text" value="${customer}"></td>
        <td class="bold" colspan="2">REPORT NO :</td><td colspan="3"><input type="text" value="${reportNo}"></td></tr>
        <tr><td class="bold" colspan="2">PART NO :</td><td colspan="3"><input type="text" value="${partName}"></td>
        <td class="bold" colspan="2">LOT QTY :</td><td colspan="4"><input type="text" value="${lotQty}"></td>
        <td class="bold" colspan="2">INVOICE NO :</td><td colspan="3"><input type="text" value="${invoiceNo}"></td></tr>
        <tr><td class="bold" colspan="2">DESCRIPTION :</td><td colspan="3"><input type="text" value="${description}"></td>
        <td class="bold" colspan="2">SAMPLE SIZE :</td><td colspan="4"><input type="text" id="firSampleSizeInput" value="${sampleSize}"></td>
        <td class="bold" colspan="2">DATE :</td><td colspan="3"><input type="text" value="${reportDate}"></td></tr>
        <tr><td class="bold" colspan="2">DRAW.REV NO :</td><td colspan="14"><input type="text" value="${drawRev}"></td></tr>
      </table>`;

    html += `<div class="section-title">A) Dimension Parameters</div>
      <table class="data-table" id="dimension-table"><thead>
        <tr><th rowspan="2" style="width:5%;">Sl No</th>
        <th rowspan="2" style="width:15%;">Parameter</th>
        <th rowspan="2" style="width:15%;">Specification</th>
        <th rowspan="2" style="width:5%;">Special Char.</th>
        <th rowspan="2" style="width:10%;">Method of Inspection</th>
        <th colspan="5" style="width:41%;" class="fir-col-head">Actual Measured Values</th>
        <th rowspan="2" style="width:8%;">Remarks</th></tr>
        <tr><th class="fir-col-head-num">1</th><th class="fir-col-head-num">2</th>
        <th class="fir-col-head-num">3</th><th class="fir-col-head-num">4</th><th class="fir-col-head-num">5</th></tr>
      </thead><tbody>`;

    const actualInput = '<input type="text" class="actual-value quali-font">';
    const remarksInput = '<input type="text" class="remarks-value quali-font">';
    const wrapCell = (val) => `<textarea rows="1">${esc(val || '')}</textarea>`;
    const shortInput = (val) => `<input type="text" value="${esc(val || '')}">`;
    const methodInput = (val) => `<input type="text" class="method-input" value="${esc(val || '')}">`;
    const specialCharInput = (val) => `<input type="text" class="special-char-input" value="${esc(val || '')}">`;
    for (let i = 1; i <= totalRows; i++) {
      const idx = i - 1;
      const row = FIR_SPEC_DATA[idx];
      if (row) {
        html += `<tr><td>${slno++}</td><td>${wrapCell(row.parameter)}</td><td>${wrapCell(row.specification)}</td><td>${specialCharInput(row.special_char)}</td><td>${methodInput(row.method_of_inspection)}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${remarksInput}</td></tr>`;
      } else {
        html += `<tr><td>${slno++}</td><td>${wrapCell()}</td><td>${wrapCell()}</td><td>${specialCharInput()}</td><td>${methodInput()}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${remarksInput}</td></tr>`;
      }
    }
    html += `</tbody></table>`;

    {
        const actualInput = '<input type="text" class="actual-value quali-font">';
        const remarksInput = '<input type="text" class="remarks-value quali-font">';
        let bHtml = '<div class="section-title">B) Customer End Complaints Parameters & Check Points</div><table class="data-table" id="ccp-table"><thead><tr><th rowspan="2" style="width:5%;">Sl No</th><th rowspan="2" style="width:15%;">Parameter</th><th rowspan="2" style="width:15%;">Specification</th><th rowspan="2" style="width:5%;">Special Char.</th><th rowspan="2" style="width:10%;">Method</th><th colspan="5" style="width:41%;" class="fir-col-head">Actual Measured Values</th><th rowspan="2" style="width:8%;">Remarks</th></tr><tr><th class="fir-col-head-num">1</th><th class="fir-col-head-num">2</th><th class="fir-col-head-num">3</th><th class="fir-col-head-num">4</th><th class="fir-col-head-num">5</th></tr></thead><tbody>';
        if (FIR_CCP_DATA.length > 0) {
          FIR_CCP_DATA.forEach(function(r, idx) {
            bHtml += `<tr><td style="width:5%;">${slno++}</td><td>${wrapCell(r.parameter)}</td><td>${wrapCell(r.specification)}</td><td>${specialCharInput(r.special_char)}</td><td>${methodInput(r.method_of_inspection)}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${remarksInput}</td></tr>`;
          });
        }
        bHtml += '</tbody></table>';
        const cRemarksInput = '<input type="text" class="remarks-value quali-font" value="OK">';
        let cHtml = '<div class="section-title">C) Material Grade</div><table class="data-table" id="material-table"><tbody>';
        if (FIR_MATERIAL_DATA.length > 0) {
          FIR_MATERIAL_DATA.forEach(function(r) {
            cHtml += `<tr><td style="width:5%;">${slno++}</td><td style="width:85%;">${wrapCell(r.material_grade)}</td><td style="width:10%;">${cRemarksInput}</td></tr>`;
          });
        } else {
          cHtml += `<tr><td style="width:5%;">${slno++}</td><td style="width:85%;">${wrapCell()}</td><td style="width:10%;">${cRemarksInput}</td></tr>`;
        }
        cHtml += '</tbody></table>';
        let dHtml = '<div class="section-title">D) Surface Coating</div><table class="data-table" id="coating-table"><thead><tr><th rowspan="2" style="width:5%;">Sl No</th><th rowspan="2" style="width:15%;">Parameter</th><th rowspan="2" style="width:15%;">Specification</th><th rowspan="2" style="width:5%;">Special Char.</th><th rowspan="2" style="width:10%;">Method</th><th colspan="5" style="width:41%;" class="fir-col-head">Actual Measured Values</th><th rowspan="2" style="width:8%;">Remarks</th></tr><tr><th class="fir-col-head-num">1</th><th class="fir-col-head-num">2</th><th class="fir-col-head-num">3</th><th class="fir-col-head-num">4</th><th class="fir-col-head-num">5</th></tr></thead><tbody>';
        if (FIR_COATING_DATA.length > 0) {
          FIR_COATING_DATA.forEach(function(r) {
            dHtml += `<tr><td>${slno++}</td><td>${wrapCell(r.parameter)}</td><td>${wrapCell(r.specification)}</td><td>${specialCharInput(r.special_char)}</td><td>${methodInput(r.method_of_inspection)}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${remarksInput}</td></tr>`;
          });
        } else {
          dHtml += `<tr><td>${slno++}</td><td>${wrapCell()}</td><td>${wrapCell()}</td><td>${specialCharInput()}</td><td>${methodInput()}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${actualInput}</td><td>${remarksInput}</td></tr>`;
        }
        dHtml += '</tbody></table>';
        html += bHtml + cHtml + dHtml;
    }

    html += `
        <table class="data-table signatures-section" style="margin-top:0;">
          <tr style="height:58px;">
            <td class="bold">Inspector Name & Sign:</td>
            <td class="signature-cell"><div class="signature-container">
              <img id="signaturePreview" class="signature-preview"></div></td>
            <td class="section-title">Status of Inspection:</td><td id="status-accepted" class="status-btn" colspan="2">Accepted</td><td id="status-rejected" class="status-btn" style="display:none;" colspan="2">Rejected</td>
            <td class="section-title">AL SQE Verification</td><td><input type="text"></td></tr>
          <tr style="height:58px;">
            <td class="bold">Quality Head Name & Sign:</td>
            <td class="signature-cell"><div class="signature-container">
              <img id="qSignaturePreview" class="signature-preview"></div></td>
            <td class="section-title" rowspan="3">Sampling Plan</td>

  // --- Parse specification to get min/max (within tolerance); step 0.5 for R (radius) specs ---
  function parseSpec(specStr) {
    const s = (specStr || "").trim();
    if (!s) return null;
    const isRadius = /R\s*\d/i.test(s);
    const isAngle = /°|\bdeg(?:ree)?s?\b/i.test(s);

    // "96.91/97.16" or "5/6" → allowable range [min, max] (order-independent)
    const slashRange = s.match(/\b([0-9]+(?:\.[0-9]+)?)\s*\/\s*([0-9]+(?:\.[0-9]+)?)\b/);
    if (slashRange) {
      const a = parseFloat(slashRange[1]);
      const b = parseFloat(slashRange[2]);
      if (!isNaN(a) && !isNaN(b)) {
        const lo = Math.min(a, b);
        const hi = Math.max(a, b);
        const nominal = (lo + hi) / 2;
        return { min: lo, max: hi, nominal, step: isRadius ? 0.5 : null, isRadius, isAngle };
      }
    }

    // "R3±R1", "R3±1", "R 3 ± R 1" → symmetric band around nominal R
    const rBand = s.match(/R\s*([0-9]+(?:\.[0-9]+)?)\s*±\s*R?\s*([0-9]+(?:\.[0-9]+)?)/i);
    if (rBand) {
      const nominalR = parseFloat(rBand[1]);
      const tolR = parseFloat(rBand[2]);
      if (!isNaN(nominalR) && !isNaN(tolR)) {
        return {
          min: nominalR - tolR,
          max: nominalR + tolR,
          nominal: nominalR,
          step: 0.5,
          isRadius: true,
          isAngle,
        };
      }
    }

    const numStr = s.replace(/[^\d.\s±+-]/g, " ").trim();
    const numbers = numStr.match(/-?\d+\.?\d*/g);
    if (!numbers || numbers.length === 0) return null;
    const nominal = parseFloat(numbers[0]);
    if (isNaN(nominal)) return null;
    let min = nominal, max = nominal;
    const plusMinus = s.match(/±\s*([0-9.]+)/i);
    const plusOnly = s.match(/\+\s*([0-9.]+)/);
    const minusOnly = s.match(/-(\s*[0-9.]+)/);
    if (plusMinus) {
      const tol = parseFloat(plusMinus[1]);
      if (!isNaN(tol)) { min = nominal - tol; max = nominal + tol; }
    } else if (plusOnly && minusOnly) {
      const upper = parseFloat(plusOnly[1]);
      const lower = parseFloat(minusOnly[1].trim());
      if (!isNaN(upper)) max = nominal + upper;
      if (!isNaN(lower)) min = nominal - lower;
    } else if (plusOnly) {
      const upper = parseFloat(plusOnly[1]);
      if (!isNaN(upper)) max = nominal + upper;
    } else if (minusOnly) {
      const lower = parseFloat(minusOnly[1].trim());
      if (!isNaN(lower)) min = nominal - lower;
    } else if (isRadius) {
      // Plain R## in spec (no ± shown): default bands — < R5 → ±0.5, R5 and above → ±1
      const tol = nominal < 5 ? 0.5 : 1;
      min = nominal - tol;
      max = nominal + tol;
    } else {
      const tol = 0.1 * Math.abs(nominal) || 0.1;
      min = nominal - tol; max = nominal + tol;
    }
    return { min, max, nominal, step: isRadius ? 0.5 : null, isRadius, isAngle };
  }

  function randomInRange(min, max, step) {
    if (max < min) { const t = min; min = max; max = t; }
    var v;
    if (min === max) {
      if (step === 0.5) v = Math.round(min * 2) / 2;
      else if (step === 0.1) v = Number(min.toFixed(1));
      else v = Number(min.toFixed(2));
    } else if (step === 0.5) {
      const steps = Math.round((max - min) / 0.5) + 1;
      const idx = Math.floor(Math.random() * steps);
      v = Math.round((min + idx * 0.5) * 2) / 2;
      v = Number(v.toFixed(1));
    } else if (step === 0.1) {
      const steps = Math.round((max - min) / 0.1) + 1;
      const idx = Math.floor(Math.random() * steps);
      v = Math.round((min + idx * 0.1) * 10) / 10;
      v = Number(v.toFixed(1));
    } else {
      v = min + Math.random() * (max - min);
      v = Number(v.toFixed(2));
    }
    if (v < min) v = min;
    if (v > max) v = max;
    if (step === 0.1) v = Number(Number(v).toFixed(1));
    return v;
  }

  function isWithinSpec(value, min, max) {
    const n = parseFloat(String(value).replace(/[^\d.-]/g, ""));
    if (isNaN(n)) return false;
    return n >= min && n <= max;
  }

  /** DFT / thickness in microns — autofill uses one decimal (e.g. 65.1). */
  function firIsDftStyleRow(param, spec) {
    var p = (param || "").toUpperCase();
    var s = (spec || "").toLowerCase();
    if (p.indexOf("DFT") !== -1) return true;
    if (/\bmicron|\bmicrons\b/.test(s)) return true;
    if (/\bum\b/.test(s) || s.indexOf("µ") !== -1) return true;
    return false;
  }

  function formatMeasuredValue(value, range) {
    if (!range) return String(value);
    if (range.isRadius) {
      // Radius rows should look like R6, R6.5, R5
      const num = Number(value);
      const text = Number.isInteger(num) ? String(num) : String(num).replace(/\.?0+$/, "");
      return `R${text}`;
    }
    if (range.isAngle) {
      // Angle rows should explicitly show degree symbol.
      const num = Number(value);
      const text = Number(num.toFixed(2)).toString();
      return `${text}\u00B0`;
    }
    if (range.oneDecimal) {
      return Number(value).toFixed(1);
    }
    return String(value);
  }

  /** Recompute Remarks from spec + filled measured cells (active sample columns only). */
  function firUpdateRowRemarksFromMeasurements(tr) {
    if (!tr) return;
    var cells = tr.querySelectorAll(":scope > td");
    if (cells.length < 11) return;
    var specEl = cells[2].querySelector("textarea") || cells[2].querySelector("input");
    var methodEl = cells[4].querySelector("input");
    var remarksEl = cells[10].querySelector("input.remarks-value") || cells[10].querySelector("input");
    if (!specEl || !methodEl || !remarksEl) return;
    var method = (methodEl.value || "").trim().toUpperCase();
    if (method === "VISUAL" || method === "VISUAL INSPECTION") {
      remarksEl.value = "OK";
      updateStatusButtons();
      return;
    }
    var spec = (specEl.value || "").trim();
    var range = parseSpec(spec);
    if (!range) {
      remarksEl.value = "";
      updateStatusButtons();
      return;
    }
    var nActive = firGetMeasuredColumnCount();
    var min = range.min, max = range.max;
    var allOk = true;
    for (var ci = 5; ci < 5 + nActive && ci <= 9; ci++) {
      var td = cells[ci];
      if (!td) { allOk = false; break; }
      var inp = td.querySelector("input.actual-value") || td.querySelector('input[type="text"]');
      if (!inp || inp.disabled) continue;
      var raw = (inp.value || "").trim();
      if (raw === "") { allOk = false; break; }
      if (!isWithinSpec(raw, min, max)) allOk = false;
    }
    remarksEl.value = allOk ? "OK" : "Not OK";
    updateStatusButtons();
  }

  /** Sl No | Parameter | Specification | Special char | Method | 5× actual | Remarks (11 cells) */
  function fillOneRow(tr) {
    var cells = tr.querySelectorAll(":scope > td");
    if (cells.length < 11) return;
    var specEl = cells[2].querySelector("textarea") || cells[2].querySelector("input");
    var methodEl = cells[4].querySelector("input");
    var remarksEl = cells[10].querySelector("input.remarks-value") || cells[10].querySelector("input");
    if (!specEl || !methodEl || !remarksEl) return;
    var actualInputs = [];
    for (var ci = 5; ci <= 9; ci++) {
      var inp = cells[ci].querySelector("input.actual-value") || cells[ci].querySelector('input[type="text"]');
      if (!inp) return;
      actualInputs.push(inp);
    }
    var nActive = firGetMeasuredColumnCount();
    var method = (methodEl.value || "").trim().toUpperCase();
    var spec = (specEl.value || "").trim();
    if (method === "VISUAL" || method === "VISUAL INSPECTION") {
      actualInputs.forEach(function(inp, idx) {
        if (idx < nActive) inp.value = "OK";
        else { inp.value = ""; }
      });
      remarksEl.value = "OK";
      updateStatusButtons();
      return;
    }
    var paramEl = cells[1].querySelector("textarea") || cells[1].querySelector("input");
    var paramText = paramEl ? (paramEl.value || "").trim() : "";
    var range = parseSpec(spec);
    if (!range) {
      actualInputs.forEach(function(inp) { inp.value = ""; });
      remarksEl.value = "";
      updateStatusButtons();
      return;
    }
    if (firIsDftStyleRow(paramText, spec)) {
      range = Object.assign({}, range, { step: 0.1, oneDecimal: true });
    }
    var min = range.min, max = range.max, step = range.step;
    var values = [];
    for (var i = 0; i < nActive; i++) values.push(randomInRange(min, max, step));
    var formatted = values.map(function(v) { return formatMeasuredValue(v, range); });
    actualInputs.forEach(function(inp, idx) {
      if (idx < nActive) inp.value = formatted[idx];
      else inp.value = "";
    });
    firUpdateRowRemarksFromMeasurements(tr);
  }

  // --- Smart paste ---
  document.addEventListener("paste", e => {
    const active = document.activeElement;
    if (active && active.disabled) return;
    if (active && (active.tagName === "INPUT" || active.tagName === "TEXTAREA")) {
      e.preventDefault();
      const text = (e.clipboardData || window.clipboardData).getData("text");
      const rows = text.trim().split(/\r?\n/);
      const rowEl = active.closest("tr");
      if (!rowEl) return;

      const allInputs = Array.from(rowEl.querySelectorAll("input[type='text'], textarea")).filter(
        (el) => !el.disabled
      );
      const currentIndex = allInputs.indexOf(active);

      let rIndex = 0;
      for (const rowData of rows) {
        const cells = rowData.split(/\t/);
        for (let c = 0; c < cells.length; c++) {
          const target = allInputs[currentIndex + c + rIndex * allInputs.length];
          if (target) target.value = cells[c].trim();
        }
        rIndex++;
      }
      const event = new Event("input", { bubbles: true });
      active.dispatchEvent(event);
      if (rowEl) firUpdateRowRemarksFromMeasurements(rowEl);
    }
  });

  /** html2pdf/html2canvas does not reliably apply CSS filter: grayscale — rasterize imgs to grey JPEGs before capture */
  function firGrayscaleImageForPdf(img) {
    return new Promise(function(resolve) {
      if (!img || !img.getAttribute("src")) {
        resolve();
        return;
      }
      if (img.dataset.firPdfOrigSrc) {
        resolve();
        return;
      }
      var finish = function() {
        resolve();
      };
      var apply = function() {
        try {
          var w = img.naturalWidth || img.width;
          var h = img.naturalHeight || img.height;
          if (!w || !h) {
            finish();
            return;
          }
          var maxEdge = typeof FIR_PDF_IMG_MAX_EDGE !== "undefined" ? FIR_PDF_IMG_MAX_EDGE : 100000;
          if (maxEdge > 0 && maxEdge < 100000 && (w > maxEdge || h > maxEdge)) {
            var shrink = Math.min(maxEdge / w, maxEdge / h);
            w = Math.max(1, Math.round(w * shrink));
            h = Math.max(1, Math.round(h * shrink));
          }
          var c = document.createElement("canvas");
          c.width = w;
          c.height = h;
          var ctx = c.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          var idata = ctx.getImageData(0, 0, w, h);
          var d = idata.data;
          for (var i = 0; i < d.length; i += 4) {
            var g = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
            d[i] = d[i + 1] = d[i + 2] = g;
          }
          ctx.putImageData(idata, 0, 0);
          img.dataset.firPdfOrigSrc = img.src;
          img.src = c.toDataURL("image/jpeg", FIR_PDF_IMG_JPEG);
        } catch (e) {
          /* tainted canvas (cross-origin without CORS) — keep original */
        }
        finish();
      };
      if (img.complete && img.naturalWidth) {
        apply();
      } else {
        img.onload = function() {
          apply();
        };
        img.onerror = finish;
      }
    });
  }

  function firPrepareImagesForPdf(root) {
    var imgs = Array.prototype.slice.call(root.querySelectorAll("img"));
    return Promise.all(imgs.map(function(im) {
      return firGrayscaleImageForPdf(im);
    }));
  }

  function firRestoreImagesAfterPdf(root) {
    Array.prototype.forEach.call(root.querySelectorAll("img[data-fir-pdf-orig-src]"), function(img) {
      img.src = img.dataset.firPdfOrigSrc;
      img.removeAttribute("data-fir-pdf-orig-src");
    });
  }

  /** Wait for Quali/custom fonts + logo/signature images before html2canvas capture */
  function firWaitForAssets(root) {
    root = root || document.getElementById("reportRoot");
    if (!root) return Promise.resolve();
    var fontWait =
      typeof document.fonts !== "undefined" && document.fonts.ready
        ? document.fonts.ready
        : Promise.resolve();
    return fontWait.then(function() {
      var imgs = Array.prototype.slice.call(root.querySelectorAll("img"));
      return Promise.all(
        imgs.map(function(img) {
          if (!img.getAttribute("src")) return Promise.resolve();
          if (img.complete && img.naturalWidth) {
            if (img.decode && typeof img.decode === "function") {
              return img.decode().catch(function() { return undefined; });
            }
            return Promise.resolve();
          }
          return new Promise(function(res) {
            img.onload = function() {
              if (img.decode && typeof img.decode === "function") {
                img.decode().catch(function() {}).finally(function() { res(); });
              } else {
                res();
              }
            };
            img.onerror = function() { res(); };
          });
        })
      );
    }).then(function() {
      return new Promise(function(res) {
        requestAnimationFrame(function() {
          requestAnimationFrame(res);
        });
      });
    });
  }

  // --- PDF Download ---
  var downloadBtn = document.getElementById("downloadPDF");
  if (downloadBtn) {
    downloadBtn.addEventListener("click", function() {
    const btn = document.getElementById("downloadPDF");
    const autofillBtn = document.getElementById("autofillMeasuredBtn");
    btn.style.display = "none";
    if (autofillBtn) autofillBtn.style.display = "none";

    document.body.classList.add('generating-pdf');
    const partInput = [...document.querySelectorAll('input[type="text"]')].find(i => i.closest('td')?.previousElementSibling?.textContent?.includes("PART"));
    const invoiceInput = [...document.querySelectorAll('input[type="text"]')].find(i => i.closest('td')?.previousElementSibling?.textContent?.includes("INVOICE"));
    const fileName = `${(invoiceInput?.value || 'Invoice').replace(/\W+/g,'_')}_${(partInput?.value || 'Part').replace(/\W+/g,'_')}_FIR.pdf`;

    function restorePdfUi() {
      firRestoreImagesAfterPdf(el);
      document.body.classList.remove('generating-pdf');
      btn.style.display = "block";
      if (autofillBtn) autofillBtn.style.display = "block";
    }

    firWaitForAssets(el).then(function() {
      return firPrepareImagesForPdf(el);
    }).then(function() {
      return html2pdf().set({
        margin: 0,
        filename: fileName,
        image: { type: 'jpeg', quality: FIR_PDF_JPEG_QUALITY },
        html2canvas: {
          scale: FIR_PDF_CANVAS_SCALE,
          useCORS: true,
          logging: false,
          scrollY: 0,
          scrollX: 0,
          windowHeight: el.scrollHeight,
        },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
        pagebreak: { mode: ['css'] }
      }).from(el).save();
    }).then(restorePdfUi).catch(function() {
      restorePdfUi();
    });
  });
  }

  /** Batch tools on parent page (e.g. SaaS inspection results): same-origin iframes only */
  function firGeneratePdfBlob() {
    return new Promise(function(resolve, reject) {
      if (typeof html2pdf === 'undefined') {
        reject(new Error('html2pdf not loaded'));
        return;
      }
      var btn = document.getElementById("downloadPDF");
      var autofillBtnEl = document.getElementById("autofillMeasuredBtn");
      if (btn) btn.style.display = "none";
      if (autofillBtnEl) autofillBtnEl.style.display = "none";
      var el = document.getElementById('reportRoot') || document.body;
      document.body.classList.add('generating-pdf');
      var textInputs = Array.prototype.slice.call(document.querySelectorAll('input[type="text"]'));
      var partInput = textInputs.find(function(i) {
        var td = i.closest('td');
        return td && td.previousElementSibling && td.previousElementSibling.textContent && td.previousElementSibling.textContent.indexOf("PART") !== -1;
      });
      var invoiceInput = textInputs.find(function(i) {
        var td = i.closest('td');
        return td && td.previousElementSibling && td.previousElementSibling.textContent && td.previousElementSibling.textContent.indexOf("INVOICE") !== -1;
      });
      var fileName = ((invoiceInput && invoiceInput.value) || 'Invoice').replace(/\W+/g,'_') + '_' + ((partInput && partInput.value) || 'Part').replace(/\W+/g,'_') + '_FIR.pdf';

      function restoreUi() {
        firRestoreImagesAfterPdf(el);
        document.body.classList.remove('generating-pdf');
        if (btn) btn.style.display = "block";
        if (autofillBtnEl) autofillBtnEl.style.display = "block";
      }

      firWaitForAssets(el).then(function() {
        return firPrepareImagesForPdf(el);
      }).then(function() {
        var worker = html2pdf().set({
          margin: 0,
          filename: fileName,
          image: { type: 'jpeg', quality: FIR_PDF_JPEG_QUALITY },
          html2canvas: {
            scale: FIR_PDF_CANVAS_SCALE,
            useCORS: true,
            logging: false,
            scrollY: 0,
            scrollX: 0,
            windowHeight: el.scrollHeight,
          },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'landscape' },
          pagebreak: { mode: ['css'] }
        }).from(el);

        var out = null;
        if (typeof worker.outputPdf === 'function') {
          out = worker.outputPdf('blob');
        } else if (typeof worker.output === 'function') {
          out = worker.output('blob');
        }
        if (out && typeof out.then === 'function') {
          out.then(function(blob) {
            restoreUi();
            var n = blob && blob.size ? blob.size : 0;
            var warn = "";
            if (n > 200 * 1024) {
              warn = "over_200kb";
            } else if (n > 0 && n < 100 * 1024) {
              warn = "under_100kb";
            }
            resolve({
              blob: blob,
              filename: fileName,
              byteSize: n,
              sizeWarning: warn || undefined
            });
          }).catch(function(err) {
            restoreUi();
            reject(err);
          });
        } else {
          restoreUi();
          reject(new Error('html2pdf blob output not available in this build'));
        }
      }).catch(function(err) {
        restoreUi();
        reject(err);
      });
    });
  }

  window.FIR_PREVIEW_API = {
    get ready() {
      try {
        return !!document.getElementById('dimension-table');
      } catch (e) {
        return false;
      }
    },
    waitForAssets: function() {
      return firWaitForAssets(document.getElementById('reportRoot'));
    },
    autoFillMeasuredValues: function() {
      autoFillMeasuredValues();
      updateStatusButtons();
    },
    generatePdfBlob: firGeneratePdfBlob
  };

  /* Parent page (Amplify) is cross-origin from this document (Railway): use postMessage for batch tools. */
  (function setupParentBridge() {
    var frameIndexMatch = /[?&]previewFrameIndex=(\d+)/.exec(window.location.search);
    var frameIndex = frameIndexMatch ? parseInt(frameIndexMatch[1], 10) : -1;
    if (frameIndex < 0 || window.parent === window) return;

    var readySent = false;
    var readyIv = setInterval(function () {
      if (readySent) {
        clearInterval(readyIv);
        return;
      }
      try {
        if (window.FIR_PREVIEW_API && window.FIR_PREVIEW_API.ready) {
          readySent = true;
          clearInterval(readyIv);
          window.parent.postMessage(
            { source: "fir-saas-fir-preview", type: "ready", frameIndex: frameIndex },
            "*"
          );
        }
      } catch (e) {}
    }, 200);
    setTimeout(function () {
      clearInterval(readyIv);
    }, 45000);

    window.addEventListener("message", function (ev) {
      var d = ev.data;
      if (!d || d.source !== "fir-saas-fir-preview-parent") return;
      if (d.type === "autoFill" && window.FIR_PREVIEW_API) {
        window.FIR_PREVIEW_API.autoFillMeasuredValues();
        return;
      }
      if (d.type === "generatePdf" && window.FIR_PREVIEW_API && window.FIR_PREVIEW_API.generatePdfBlob) {
        var reqId = d.requestId;
        var reply = ev.source;
        var finishErr = function (err) {
          if (reply)
            reply.postMessage(
              {
                source: "fir-saas-fir-preview",
                type: "pdfBlobResult",
                frameIndex: frameIndex,
                requestId: reqId,
                ok: false,
                error: String((err && err.message) || err),
              },
              "*"
            );
        };
        var run = function () {
          window.FIR_PREVIEW_API
            .generatePdfBlob()
            .then(function (result) {
              if (reply)
                reply.postMessage(
                  {
                    source: "fir-saas-fir-preview",
                    type: "pdfBlobResult",
                    frameIndex: frameIndex,
                    requestId: reqId,
                    ok: true,
                    filename: result.filename,
                    byteSize: result.byteSize,
                    sizeWarning: result.sizeWarning,
                    blob: result.blob,
                  },
                  "*"
                );
            })
            .catch(finishErr);
        };
        run();
      }
    });
  })();
  </script>
