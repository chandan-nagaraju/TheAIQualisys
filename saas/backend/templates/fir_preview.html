<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Final Inspection Report Preview</title>
  <style>
  @page { size: A4 landscape; margin: 10mm; }
  body { font-family: Calibri, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 0; }
  body.generating-pdf { min-width: 297mm; width: 297mm; margin: 0 auto; background: #fff; }

  #reportRoot { width: 100%; max-width: 297mm; margin: 0 auto; display: flex; flex-direction: column; align-items: center; box-sizing: border-box; }
  body.generating-pdf #reportRoot { width: 297mm !important; min-width: 297mm; max-width: 297mm; margin: 0 auto; }

  .report-container {
    position: relative;
    background: #fafaf7;
    border: 1px solid #222;
    width: 100%;
    max-width: 297mm;
    margin: 10px auto;
    padding: 6px 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    box-sizing: border-box;
    page-break-after: auto;
    overflow: hidden;
    transform: rotate(-0.06deg);
    filter: grayscale(100%) contrast(1.06);
  }
  /* Subtle scan / photocopy texture */
  .report-container::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 1px,
      rgba(0,0,0,0.04) 1px,
      rgba(0,0,0,0.04) 2px
    );
    mix-blend-mode: multiply;
    opacity: 0.85;
  }
  body.generating-pdf .report-container { overflow: visible; border: 1px solid #000; box-shadow: none; max-width: 270mm; transform: none; }

  .header-table, .data-table {
    border-collapse: collapse;
    width: 100%;
    font-size: 11px;
    border: 1px solid #333;
  }
  .data-table { table-layout: fixed; border-spacing: 0; }
  .data-table thead { display: table-header-group; }
  .header-table td, .header-table th {
    border: 1px solid #333;
    padding: 4px;
    vertical-align: middle;
    text-align: center;
    box-sizing: border-box;
    word-wrap: break-word;
  }
  .data-table td, .data-table th {
    border: 1px solid #333;
    padding: 1px 2px;
    vertical-align: middle;
    text-align: center;
    box-sizing: border-box;
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: normal;
    line-height: 1.25;
  }
  .data-table td input, .data-table th input,
  .data-table td textarea, .data-table th textarea {
    word-wrap: break-word;
    overflow-wrap: break-word;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .header-table .logo-cell {
    text-align: center;
    vertical-align: middle;
  }
  .header-table .small-cell { text-align: left; }
  .header-table { table-layout: fixed; }

  .header-title { font-size: 20px; font-weight: bold; text-align: center; }
  .logo-cell {
    font-style: italic;
    font-weight: bold;
    font-size: 18px;
    text-align: center;
  }
  .small-cell { font-size: 12px; text-align: left; padding: 3px 6px; }
  .bold { font-weight: bold; }
  .section-title {
    background: linear-gradient(180deg, #ececec 0%, #d4d4d4 100%);
    color: #000;
    font-weight: bold;
    text-align: center;
    padding: 3px 5px;
    border: 1px solid #000;
    line-height: 1.3;
  }
  /* Table subheads — neutral B&W (no blue) */
  .fir-col-head, .fir-col-head-num {
    background: #dedede !important;
    color: #000 !important;
    font-weight: bold;
  }
  .fir-col-head-num.fir-measured-inactive,
  .data-table td.fir-measured-inactive {
    background: #f0f0f0 !important;
    color: #888 !important;
  }
  input.actual-value:disabled {
    color: #999 !important;
    background: transparent !important;
    cursor: not-allowed;
  }
  body.generating-pdf .section-title { page-break-after: avoid; border-width: 1px; }
  body.generating-pdf .data-table td, body.generating-pdf .data-table th { border: 1px solid #333; }
  body.generating-pdf .data-table tbody tr { page-break-inside: avoid; }
  body.generating-pdf .signatures-section td.status-btn,
  body.generating-pdf #status-accepted,
  body.generating-pdf #status-rejected { border: 1px solid #333 !important; }
  /* html2canvas ignores CSS filter — PDF capture still showed color logos; force B&W in PDF pass */
  body.generating-pdf #status-rejected.status-btn.highlight {
    background: #404040 !important;
    color: #fff !important;
    border: 1px solid #000 !important;
  }
  body.generating-pdf input:focus,
  body.generating-pdf textarea:focus {
    background: transparent !important;
    border: none !important;
    outline: none !important;
    box-shadow: none !important;
  }

  input[type="text"] {
    width: 100%;
    border: none;
    outline: none;
    text-align: center;
    background: none;
    line-height: 1.25;
    padding: 0 1px;
  }
  .data-table textarea,
  .data-table input.method-input,
  .data-table input.special-char-input {
    font-size: 15px;
    font-family: inherit;
  }
  .fir-special-char-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-height: 2.2em;
    padding: 2px;
    box-sizing: border-box;
  }
  .fir-special-char-icon {
    max-height: 36px;
    max-width: 100%;
    width: auto;
    height: auto;
    object-fit: contain;
    flex-shrink: 0;
  }
  .fir-special-char-static {
    text-align: center;
    vertical-align: middle;
    padding: 2px;
  }
  .fir-special-char-text {
    font-size: 12px;
    line-height: 1.3;
    text-align: center;
    word-break: break-word;
  }
  input[type="text"]:focus {
    background: #e6f0ff;
    text-align: left;
    border: 1px solid #007bff;
  }
  .header-table td input, .header-table th input,
  .header-table td textarea, .header-table th textarea {
    min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
  }
  .data-table td input, .data-table th input,
  .data-table td textarea, .data-table th textarea {
    min-width: 0; max-width: 100%; width: 100%; box-sizing: border-box;
  }
  .header-table textarea {
    resize: none; border: none; outline: none; font: inherit; font-size: 11px; text-align: center;
    background: none; overflow: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    line-height: 1.25; padding: 0 1px; min-height: 1.4em;
  }
  .data-table textarea {
    resize: none; border: none; outline: none; font: inherit; font-size: 12px; text-align: center;
    background: none; overflow: hidden; white-space: pre-wrap; word-wrap: break-word; overflow-wrap: break-word;
    line-height: 1.25; padding: 0 1px; min-height: 1.4em;
  }
  .header-table textarea:focus, .data-table textarea:focus { background: #e6f0ff; border: 1px solid #007bff; }

  @font-face {
    font-family: 'Quali_1';
    src: {% if quali_font_data_uri %}url("{{ quali_font_data_uri }}") format('{{ quali_font_format }}'), {% endif %}local('Quali_1'){% if api_static_base %}, url("{{ api_static_base }}fonts/Quali_1.woff2") format('woff2'), url("{{ api_static_base }}fonts/Quali_1.woff") format('woff'), url("{{ api_static_base }}fonts/Quali_1.ttf") format('truetype'){% endif %};
    font-display: swap;
  }
  .quali-font,
  input.actual-value,
  input.remarks-value {
    font-family: 'Quali_1', sans-serif;
    line-height: 1.5;
  }
  .data-table input.actual-value,
  .data-table input.remarks-value {
    font-size: 25px;
    min-height: 0;
  }
  input.actual-value,
  input.remarks-value {
    min-height: 0;
  }

  button.upload-btn {
    background-color: #007bff; color: white; border: none;
    padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 13px;
  }
  button.upload-btn:hover { background-color: #0056b3; }
  .signature-cell { text-align: center; vertical-align: middle; padding: 10px; box-sizing: border-box; }
  .signature-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; }
  .signature-preview {
    height: 50px;
    width: auto;
    max-width: 80%;
    object-fit: contain;
    margin-top: 6px;
    border: none;
    /* Blend with report cell — avoid white box behind signatures. */
    background: transparent;
    /* Keep signature stroke dark/black while preserving transparency. */
    filter: grayscale(100%) contrast(1.9) brightness(0.78);
  }
  .fir-logo-img { filter: grayscale(100%) contrast(1.12) !important; }
  .download-btn {
    position: fixed; bottom: 20px; right: 20px;
    background-color: #28a745; color: white; border: none;
    padding: 12px 18px; border-radius: 6px;
    cursor: pointer; font-size: 15px; font-weight: bold;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2); z-index: 1000;
  }
  .download-btn:hover { background-color: #1e7e34; }
  .autofill-btn {
    position: fixed; bottom: 20px; right: 180px;
    background-color: #17a2b8; color: white; border: none;
    padding: 10px 14px; border-radius: 6px; cursor: pointer; font-size: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2); z-index: 1000;
  }
  .autofill-btn:hover { background-color: #138496; }
  .status-btn { padding: 6px 12px; font-weight: bold; text-align: center; border: 1px solid #333; border-radius: 4px; }
  #status-accepted.status-btn { background: #e8e8e8; color: #333; }
  #status-accepted.status-btn.highlight { background: #e0e0e0; color: #333; border: 1px solid #333; }
  #status-rejected.status-btn { background: #e8e8e8; color: #333; }
  #status-rejected.status-btn.highlight { background: #dc3545; color: #fff; border: 1px solid #333; }
  .signatures-section td.status-btn { border: 1px solid #333; box-sizing: border-box; }

  /* Embedded in inspection results iframes: parent page drives autofill / ZIP */
  html.fir-embedded .download-btn,
  html.fir-embedded .autofill-btn { display: none !important; }

  @media print {
    body { background: none; }
    .download-btn, .autofill-btn { display: none; }
    .report-container { box-shadow: none; border: none; overflow: visible; transform: none; }
    .data-table thead { display: table-header-group; }
    .signatures-section { page-break-inside: avoid; }
    #reportRoot { width: 297mm; margin: 0 auto; }
    .report-container { max-width: 270mm; margin: 0 auto; }
  }
  </style>
</head>

<body>
  <!-- fir-preview-ui: special char read-only from part master; no global legend -->
  <button class="download-btn" id="downloadPDF">⬇ Download PDF</button>
  <button class="autofill-btn" id="autofillMeasuredBtn" type="button">Auto-fill measured values</button>
  <div id="reportRoot"><p id="firPaintHint" style="text-align:center;color:#444;padding:32px;font-family:Calibri,Arial,sans-serif;">Loading inspection report…</p></div>

  <script type="application/json" id="fir-preview-boot">{{ fir_boot | tojson }}</script>
  <script src="{{ api_static_base }}fir_preview_runtime.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
